name: baggls
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  
  # Core scientific computing
  - numpy
  - pandas
  - scipy
  
  # Visualization
  - matplotlib
  - seaborn
  
  # Jupyter
  - jupyter
  - ipykernel
  
  # Machine Learning
  - scikit-learn
  
  # Deep Learning (PyTorch ecosystem)
  - pytorch
  - torchvision
  - torchaudio

  # ADJUST TO YOUR CUDA VERSION
  # - cpuonly  # Remove this line if you need GPU support
  # - pytorch-cuda=11.8  # or 12.1, depending on your CUDA version
  # - cudatoolkit=11.8
  
  # Configuration
  - pyyaml
  
  # Progress bars
  - tqdm
  
  # Pip packages
  - pip
  - pip:
    - pytorch-lightning
    - torchmetrics
    - logomaker
    - grelu  # For FIMO and sequence analysis
